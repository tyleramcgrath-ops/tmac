<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f2 = (x) => (x == null || !isFinite(x) ? '—' : Number(x).toFixed(2));
  const f1 = (x) => (x == null || !isFinite(x) ? '—' : Number(x).toFixed(1));
  const pct = (x) => (x == null ? '—' : Math.round(x * 100) + '%');
  const day = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const when = (t) => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const tip = $('#tip');
  function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
  function hideTip() { tip.style.display = 'none'; }

  // Severity shown with the status palette + always a text label (never color alone).
  function sev(m) {
    if (m == null) return { c: 'var(--muted)', l: '—' };
    if (m >= 8) return { c: 'var(--critical)' };
    if (m >= 6) return { c: 'var(--serious)' };
    if (m >= 4) return { c: 'var(--warning)' };
    return { c: 'var(--good)' };
  }
  function classify(scale, m) { return scale.find((s) => (m || 0) >= s.min); }

  let D = null; let range = 30;

  function load() {
    const embedded = JSON.parse($('#quake-data').textContent || 'null');
    if (embedded) { D = embedded; render(); return; }
    fetch('data.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => { D = d; render(); }).catch((e) => {
      $('#app').innerHTML = '<div class="card empty">Could not load readings: ' + esc(e.message) + '</div>';
    });
    setTimeout(load, 60000);
  }

  function render() {
    const app = $('#app');
    const sw = D.sweeps;
    const latest = sw[sw.length - 1];
    $('#updated').textContent = latest ? 'Last sweep ' + when(latest.t) : '';
    const b = [];
    if (D.mode === 'simulated') b.push('<div class="banner sim"><b>Simulated data.</b>This seismogram comes from the built-in synthetic Google (a quiet month, a spam update, a scraper-poisoning storm and a core update) so you can see how the instrument behaves. No real SERPs were read. Run <code>quake scan</code> with a SERP API key for real readings.</div>');
    if (latest && latest.interference) b.push('<div class="banner warn"><b>Sensor interference.</b>' + pct(latest.rejectedShare) + ' of the last sweep\'s readings were rejected as malformed or poisoned. Google has been serving altered results to suspected scrapers (Ahrefs, Oct 2026), so this sweep is held rather than alarmed on.</div>');
    if (latest && latest.calibrating) b.push('<div class="banner warn"><b>Calibrating.</b>Each keyword needs a few readings before it has a noise floor of its own. Magnitudes are shown, but no event can be declared until the instrument has about two days of history.</div>');
    $('#banners').innerHTML = b.join('');
    if (!latest || latest.m == null) {
      app.innerHTML = '<div class="card empty">' + (sw.length ? 'First sweep recorded: every keyword is seeded. The needle starts moving on the next sweep.' : 'No sweeps yet. Run <code>quake scan</code>.') + '</div>';
      return;
    }
    app.innerHTML = [heroHtml(latest), seismoHtml(), '<div class="grid2">' + faultsHtml() + healthHtml() + '</div>', heatHtml(), explainHtml(), eventsHtml(), scaleHtml(), sourcesHtml()].join('');
    drawSeismo();
    drawHealth();
    bindHeat();
    document.querySelectorAll('[data-range]').forEach((btn) => btn.addEventListener('click', () => { range = Number(btn.dataset.range); render(); }));
  }

  function heroHtml(s) {
    const m = s.m24 != null ? s.m24 : s.m;
    const c = classify(D.scale, m);
    const v = sev(m);
    const ev = D.events.find((e) => e.ongoing);
    return '<section class="card hero">'
      + '<div><div class="sub">Magnitude, last 24h</div><div class="mag"><small>M</small>' + f1(m) + '</div>'
      + '<div class="cat"><span class="chip"><span class="dot" style="background:' + v.c + '"></span>' + esc(c.name) + '</span><span class="sub">' + esc(c.note) + '</span></div></div>'
      + '<div>' + gaugeSvg(m)
      + '<div class="stats">'
      + stat(f1(s.m), 'This sweep (one reading)')
      + stat(pct(s.breadth), 'Keywords at 2x+ normal')
      + stat(f2(s.staLta), 'STA/LTA (trigger ≥ ' + D.config.triggerOn + ')')
      + stat(ev ? 'Since ' + day(ev.start) : 'None', ev ? 'Event in progress · peak M' + f1(ev.peak) : 'Event in progress')
      + '</div></div></section>';
  }
  function stat(v, k) { return '<div class="stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

  function gaugeSvg(m) {
    const W = 600; const H = 54; const x = (v) => 8 + (v / 10) * (W - 16);
    const bands = [[0, 4, 'var(--good)'], [4, 6, 'var(--warning)'], [6, 8, 'var(--serious)'], [8, 10, 'var(--critical)']];
    let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Magnitude gauge reading ' + f1(m) + ' of 10">';
    for (const [a, b2, c] of bands) g += '<rect x="' + (x(a) + 1) + '" y="14" width="' + (x(b2) - x(a) - 2) + '" height="10" rx="4" fill="' + c + '" opacity="0.85"/>';
    for (let i = 0; i <= 10; i++) g += '<text class="lbl" x="' + x(i) + '" y="42" text-anchor="middle">' + i + '</text>';
    const mx = x(Math.max(0, Math.min(10, m || 0)));
    g += '<path d="M' + (mx - 6) + ' 0 h12 l-6 9 z" fill="var(--ink)"/>';
    g += '<rect x="' + (mx - 1.5) + '" y="8" width="3" height="22" rx="1.5" fill="var(--ink)"/>';
    return g + '</svg>';
  }

  function inRange() {
    const sw = D.sweeps;
    if (!range) return sw;
    const end = Date.parse(sw[sw.length - 1].t);
    return sw.filter((s) => Date.parse(s.t) >= end - range * 864e5);
  }

  function seismoHtml() {
    const btn = (d, l) => '<button data-range="' + d + '" aria-pressed="' + (range === d) + '">' + l + '</button>';
    return '<section class="card"><h2>Seismogram</h2><div class="sub">Every sweep\'s magnitude (thin trace) and the 24-hour magnitude (bold). Gray bands are updates Google itself confirmed on its Search Status Dashboard; orange bands are quakes this instrument detected on its own.</div>'
      + '<div class="toolbar">' + btn(7, '7 days') + btn(30, '30 days') + btn(90, '90 days') + btn(0, 'All') + '</div>'
      + '<div id="seismo"></div>'
      + '<div class="legend"><span><i class="sw" style="background:var(--series-1);height:3px"></i>24h magnitude</span><span><i class="sw" style="background:var(--muted);height:1px"></i>single sweep</span><span><i class="swb" style="background:var(--band)"></i>Google-confirmed update</span><span><i class="swb" style="background:var(--series-2);opacity:.25"></i>Detected quake</span></div></section>';
  }

  function drawSeismo() {
    const el = $('#seismo'); const sw = inRange(); if (!sw.length) return;
    const W = Math.max(320, el.clientWidth); const H = 280; const P = { l: 34, r: 10, t: 22, b: 24 };
    const t0 = Date.parse(sw[0].t); const t1 = Math.max(t0 + 1, Date.parse(sw[sw.length - 1].t));
    const x = (t) => P.l + ((Date.parse(t) - t0) / (t1 - t0)) * (W - P.l - P.r);
    const y = (m) => P.t + (1 - Math.max(0, Math.min(10, m)) / 10) * (H - P.t - P.b);
    let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Seismogram of magnitude over time">';
    const clip = (a, b2) => [Math.max(P.l, x(a)), Math.min(W - P.r, x(b2))];
    for (const u of D.confirmed) {
      const [a, b2] = clip(u.begin, u.end || sw[sw.length - 1].t);
      if (b2 <= a) continue;
      g += '<rect x="' + a + '" y="' + P.t + '" width="' + (b2 - a) + '" height="' + (H - P.t - P.b) + '" fill="var(--band)"/>';
      g += '<text class="lbl" x="' + (a + 3) + '" y="' + (P.t - 6) + '">' + esc(u.name.replace(/ update$/, '')) + '</text>';
    }
    for (const e of D.events) {
      const [a, b2] = clip(e.start, e.end || sw[sw.length - 1].t);
      if (b2 <= a) continue;
      g += '<rect x="' + a + '" y="' + (H - P.b - 6) + '" width="' + (b2 - a) + '" height="6" rx="2" fill="var(--series-2)" opacity="0.9"/>';
      g += '<rect x="' + a + '" y="' + P.t + '" width="' + (b2 - a) + '" height="' + (H - P.t - P.b) + '" fill="var(--series-2)" opacity="0.08"/>';
    }
    for (let m = 0; m <= 10; m += 2) g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(m) + '" y2="' + y(m) + '" stroke="var(--grid)"/><text class="lbl" x="' + (P.l - 6) + '" y="' + (y(m) + 4) + '" text-anchor="end">' + m + '</text>';
    const span = (t1 - t0) / 864e5; const stepDays = span > 60 ? 14 : span > 20 ? 7 : span > 6 ? 2 : 1;
    const d0 = new Date(t0); d0.setUTCHours(0, 0, 0, 0);
    for (let t = d0.getTime(); t <= t1; t += stepDays * 864e5) { if (t < t0) continue; const xx = x(new Date(t).toISOString()); g += '<text class="lbl" x="' + xx + '" y="' + (H - 6) + '" text-anchor="middle">' + day(t) + '</text>'; }
    const path = (key) => { let d = ''; let pen = false; for (const s of sw) { if (s[key] == null) { pen = false; continue; } d += (pen ? 'L' : 'M') + x(s.t).toFixed(1) + ' ' + y(s[key]).toFixed(1); pen = true; } return d; };
    g += '<path d="' + path('m') + '" fill="none" stroke="var(--muted)" stroke-width="1" opacity="0.8"/>';
    g += '<path d="' + path('m24') + '" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round"/>';
    g += '<line id="xh" x1="0" x2="0" y1="' + P.t + '" y2="' + (H - P.b) + '" stroke="var(--axis)" visibility="hidden"/><circle id="xd" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>';
    g += '<rect x="' + P.l + '" y="0" width="' + (W - P.l - P.r) + '" height="' + H + '" fill="transparent" id="hit"/></svg>';
    el.innerHTML = g;
    const svg = el.querySelector('svg'); const hit = el.querySelector('#hit');
    hit.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect(); const px = ((e.clientX - r.left) / r.width) * W;
      let best = sw[0]; for (const s of sw) if (Math.abs(x(s.t) - px) < Math.abs(x(best.t) - px)) best = s;
      const xh = el.querySelector('#xh'); const xd = el.querySelector('#xd');
      xh.setAttribute('x1', x(best.t)); xh.setAttribute('x2', x(best.t)); xh.setAttribute('visibility', 'visible');
      if (best.m24 != null) { xd.setAttribute('cx', x(best.t)); xd.setAttribute('cy', y(best.m24)); xd.setAttribute('visibility', 'visible'); }
      const conf = D.confirmed.filter((u) => Date.parse(u.begin) <= Date.parse(best.t) && (!u.end || Date.parse(u.end) >= Date.parse(best.t))).map((u) => u.name);
      showTip(e, '<b>' + when(best.t) + '</b><br>24h magnitude <b>M' + f1(best.m24) + '</b> · ' + esc(classify(D.scale, best.m24 || 0).name)
        + '<br>this sweep M' + f1(best.m) + ' · R ' + f2(best.R) + '<br>breadth ' + pct(best.breadth) + ' · STA/LTA ' + f2(best.staLta)
        + (best.inEvent ? '<br><b>Quake in progress</b>' : '') + (conf.length ? '<br>Google: ' + esc(conf.join(', ')) : '')
        + (best.rejectedShare ? '<br>' + pct(best.rejectedShare) + ' of readings rejected' : '') + (best.calibrating ? '<br>calibrating' : ''));
    });
    hit.addEventListener('mouseleave', () => { hideTip(); el.querySelector('#xh').setAttribute('visibility', 'hidden'); el.querySelector('#xd').setAttribute('visibility', 'hidden'); });
  }

  function faultsHtml() {
    const f = D.explain.faults; const max = Math.max(4, ...Object.values(f).map((v) => v.median));
    const rows = Object.entries(f).sort((a, b) => b[1].median - a[1].median).map(([v, x]) =>
      '<div class="fault"><span>' + esc(v) + '</span><span class="bar" title="median ' + f2(x.median) + 'x normal"><i style="width:' + Math.min(100, (x.median / max) * 100) + '%"></i><s style="left:' + (1 / max) * 100 + '%"></s><s style="left:' + (D.config.faultTrigger / max) * 100 + '%;opacity:.5"></s></span><span class="num">' + f2(x.median) + 'x' + (x.active ? ' · active' : '') + '</span></div>').join('');
    return '<section class="card"><h2>Fault lines</h2><div class="sub">Each vertical\'s median keyword, as a multiple of its own normal shaking (dark tick = 1x normal, faint tick = ' + D.config.faultTrigger + 'x, where a fault line counts as active). A core update lights most of them; a niche update lights one or two.</div>' + rows + '</section>';
  }

  function healthHtml() {
    const i = D.explain.instrument;
    return '<section class="card"><h2>Instrument health</h2><div class="sub">Google now feeds altered results to suspected scrapers (Ahrefs measured 5–20% of results affected, Oct 2026). Left in, poisoned reads look like earthquakes. Share of readings rejected per sweep:</div><div id="health"></div>'
      + '<div class="stats">' + stat(i.measured + '/' + i.stations, 'Stations measured') + stat(i.rejected, 'Rejected this sweep') + stat(i.poisonCaught, 'Poisoned reads caught & re-fetched') + stat(i.errors, 'Fetch errors') + '</div></section>';
  }

  function drawHealth() {
    const el = $('#health'); const sw = inRange(); if (!el || !sw.length) return;
    const W = Math.max(280, el.clientWidth); const H = 90; const P = { l: 34, r: 6, t: 8, b: 16 };
    const t0 = Date.parse(sw[0].t); const t1 = Math.max(t0 + 1, Date.parse(sw[sw.length - 1].t));
    const max = Math.max(0.3, ...sw.map((s) => s.rejectedShare || 0));
    const x = (t) => P.l + ((Date.parse(t) - t0) / (t1 - t0)) * (W - P.l - P.r);
    const y = (v) => P.t + (1 - v / max) * (H - P.t - P.b);
    let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Rejected reading share over time">';
    g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(D.config.interferenceShare) + '" y2="' + y(D.config.interferenceShare) + '" stroke="var(--warning)" stroke-dasharray="4 3"/>';
    g += '<text class="lbl" x="' + (P.l - 6) + '" y="' + (y(D.config.interferenceShare) + 4) + '" text-anchor="end">' + pct(D.config.interferenceShare) + '</text><text class="lbl" x="' + (P.l - 6) + '" y="' + (y(0) + 4) + '" text-anchor="end">0%</text>';
    let d = ''; sw.forEach((s, k) => { d += (k ? 'L' : 'M') + x(s.t).toFixed(1) + ' ' + y(s.rejectedShare || 0).toFixed(1); });
    g += '<path d="' + d + '" fill="none" stroke="var(--series-1)" stroke-width="1.5"/></svg>';
    el.innerHTML = g + '<div class="legend"><span><i class="sw" style="background:var(--series-1)"></i>rejected share</span><span><i class="sw" style="background:var(--warning)"></i>interference threshold</span></div>';
  }

  function heatColor(v) {
    if (v == null) return 'var(--seq-0)';
    const steps = [0.5, 1, 1.5, 2, 3, 4, 6];
    let k = 0; while (k < steps.length && v >= steps[k]) k++;
    return 'var(--seq-' + k + ')';
  }

  function heatHtml() {
    const sw = D.sweeps.slice(-Math.min(D.sweeps.length, 84));
    const byV = {}; for (const s of D.stations) (byV[s.vertical] = byV[s.vertical] || []).push(s);
    let rows = '';
    for (const [v, list] of Object.entries(byV)) {
      rows += '<tr class="vh"><th colspan="' + (sw.length + 1) + '">' + esc(v) + '</th></tr>';
      for (const st of list) {
        rows += '<tr><th title="' + esc(st.keyword) + '">' + esc(st.keyword) + '</th>';
        for (let k = 0; k < sw.length; k++) {
          const x = sw[k].st[st.id];
          const isNum = typeof x === 'number';
          const cls = !isNum && (x === 'r' || x === 'e') ? ' class="hatch"' : '';
          rows += '<td' + cls + ' data-i="' + k + '" data-s="' + esc(st.id) + '" style="background-color:' + (isNum ? heatColor(x) : 'transparent') + '"></td>';
        }
        rows += '</tr>';
      }
    }
    const leg = [['<0.5x', 0], ['1x', 1], ['1.5x', 2], ['2x', 3], ['3x', 4], ['4x', 5], ['6x+', 7]].map(([l, k]) => '<span><i class="swb" style="background:var(--seq-' + k + ')"></i>' + l + '</span>').join('');
    return '<section class="card"><h2>Station array</h2><div class="sub">Every keyword (row) at every sweep (column, last ' + sw.length + '), colored by how hard it shook relative to its own normal. A real update paints whole columns; scattered poisoning paints isolated hatched cells, which are dropped from the measurement.</div>'
      + '<div class="heat" id="heat"><table>' + rows + '</table></div><div class="legend">' + leg + '<span><i class="swb hatch"></i>rejected (malformed / poisoned / error)</span></div></section>';
  }
  function bindHeat() {
    const sw = D.sweeps.slice(-Math.min(D.sweeps.length, 84));
    const kw = Object.fromEntries(D.stations.map((s) => [s.id, s]));
    const h = $('#heat'); if (!h) return;
    h.addEventListener('mousemove', (e) => {
      const td = e.target.closest('td[data-i]'); if (!td) { hideTip(); return; }
      const s = sw[Number(td.dataset.i)]; const x = s.st[td.dataset.s];
      const label = typeof x === 'number' ? f2(x) + 'x its normal shaking' : ({ r: 'rejected (malformed or poisoned)', e: 'fetch error', s: 'first reading (seed)' }[x] || 'no reading');
      showTip(e, '<b>' + esc(kw[td.dataset.s].keyword) + '</b><br>' + when(s.t) + '<br>' + label);
    });
    h.addEventListener('mouseleave', hideTip);
  }

  function explainHtml() {
    const e = D.explain; const W = D.weights; const C = D.config;
    const c = e.components;
    const typ = e.typical; const top = e.mostShaken[0];
    const A = W.rank * c.rank + W.traffic * c.traffic + W.domain * c.domain + W.feature * c.feature;
    const faults = Object.entries(e.faults).filter(([, f]) => f.active).map(([v]) => v);
    return '<section class="card"><h2>How the needle got to M' + f1(e.m24) + '</h2><div class="sub">The latest sweep, ' + when(e.t) + ', worked through with its real numbers. Every variable is shown, along with why it is in the formula.</div>'
      + step(1, 'Measure each keyword\'s ground motion', 'Each keyword is a seismometer. Its top 10 is compared with its previous accepted reading on four independent measures, each 0 (identical) to 1 (completely different):',
        'amplitude = ' + W.rank + '×rank + ' + W.traffic + '×clicks + ' + W.domain + '×domains + ' + W.feature + '×features\n'
        + 'median keyword this sweep: ' + W.rank + '×' + f2(c.rank) + ' + ' + W.traffic + '×' + f2(c.traffic) + ' + ' + W.domain + '×' + f2(c.domain) + ' + ' + W.feature + '×' + f2(c.feature) + ' ≈ ' + f2(A),
        '<b>rank (' + W.rank + ')</b>: 1 − rank-biased overlap (Webber et al., 2010) with persistence p=' + D.rboP + '. It weights the top of the list most, handles pages entering and leaving, and is the standard way to compare two ranked lists. This is the order of results itself, so it gets the most weight.<br>'
        + '<b>clicks (' + W.traffic + ')</b>: share of the top 10\'s click value that changed hands, using a CTR curve (position 1 ≈ ' + Math.round(D.ctr[0] * 100) + '%, position 10 ≈ ' + (D.ctr[9] * 100).toFixed(1) + '%). A swap at #1 moves about 10× the traffic of a swap at #10. This is what site owners feel.<br>'
        + '<b>domains (' + W.domain + ')</b>: Jaccard distance between the sets of sites in the top 10. A core update replaces <i>who</i> ranks, not just the order. Pages from the same site trading places is churn; new sites arriving is a quake.<br>'
        + '<b>features (' + W.feature + ')</b>: Jaccard distance between SERP features (AI Overview, featured snippet, People Also Ask, local pack, videos…). Google often changes the page layout during updates, but features also flicker on their own, so this gets the least weight.')
      + step(2, 'Divide by each keyword\'s own normal', 'Some keywords churn every day (travel, news-adjacent), and some barely move (definitions). Each keyword\'s amplitude is divided by the median of its last ' + C.baselineWindow + ' quiet readings (about 30 days at a 6-hour cadence; readings taken during a declared quake are left out so the instrument doesn\'t learn the quake as normal). The floor is ' + C.baselineFloor + ', so a frozen keyword moving one spot can\'t read as a 50× quake. This is a seismometer\'s station correction.',
        (typ ? 'typical: "' + typ.keyword + '"  ' + f2(typ.amplitude) + ' ÷ ' + f2(typ.baseline) + ' = ' + f2(typ.ratio) + '× normal\n' : '')
        + (top ? 'most shaken: "' + top.keyword + '" (' + top.vertical + ')  ' + f2(top.amplitude) + ' ÷ ' + f2(top.baseline) + ' = ' + f2(top.ratio) + '× normal' : ''), '')
      + step(3, 'Combine the network, robustly', 'The network reading is the <b>interquartile mean</b> of all keyword ratios, which is the average of the middle 50%. One keyword going wild can\'t move it, and neither can poisoned results unless more than a quarter of keywords are corrupted in the same direction. That clears Ahrefs\' measured 5–20%. The result is then divided by the network\'s own quiet level (R0), because an ordinary day doesn\'t average exactly 1.',
        'R = IQM(ratios) ÷ R0 = ' + f2(e.rawR) + ' ÷ ' + f2(e.R0) + ' = ' + f2(e.R), '')
      + step(4, 'Convert to a logarithmic magnitude', 'Earthquake scales are logarithmic because shaking spans orders of magnitude. Here an ordinary day is defined as M2, and <b>every +3 means the whole network is shaking twice as hard</b>: M5 = 2× normal, M8 = 4×, M10 ≈ 6.3×. The scale is capped at 10. The headline is the 24-hour magnitude (the average R over the last day), because one sweep is a single noisy sample. Seismologists likewise report sustained amplitude, not one wiggle of the needle.',
        'M = ' + C.magnitudeBase + ' + ' + C.magnitudePerDoubling + '·log2(R)\nthis sweep: 2 + 3·log2(' + f2(e.R) + ') = ' + f2(e.magnitude) + '\nlast 24h:   2 + 3·log2(' + f2(e.sta) + ') = ' + f2(e.m24), '')
      + step(5, 'Decide whether it is a quake', 'The trigger is the STA/LTA ratio, the standard automatic earthquake picker. It compares the short-term average (' + C.staHours + 'h) with the long-term quiet average (' + C.ltaHours / 24 + ' days). A quake is declared when STA/LTA ≥ ' + C.triggerOn + ', at least ' + pct(C.triggerBreadth) + ' of keywords shake at ≥' + C.stationTrigger + '× their normal, the sweep reads at least M' + C.triggerMinMagnitude + ', and the instrument isn\'t reporting interference. It ends after ' + C.detriggerHours + 'h below ' + C.triggerOff + '. Breadth matters because a core update shakes everything, while one SERP flipping is just that keyword.',
        'STA/LTA = ' + f2(e.sta) + ' ÷ ' + f2(e.lta) + ' = ' + f2(e.staLta) + '   breadth = ' + pct(e.breadth) + '   active fault lines: ' + (faults.length ? faults.join(', ') : 'none')
        + '\n→ ' + (e.inEvent ? 'QUAKE IN PROGRESS' : e.calibrating ? 'calibrating, no trigger yet' : 'no quake declared'), '')
      + step(6, 'Throw out poisoned readings first', 'Before any of the above, each reading is checked. Fewer than ' + C.minOrganic + ' results, or more than ' + C.maxSameDomain + ' of 10 from one site, is rejected as malformed. If a keyword\'s whole top 10 is replaced at once (rank ≥ ' + C.suspectRank + ' and domains ≥ ' + C.suspectDomain + '), it is re-fetched, through a second provider if one is configured. If the second look matches the old SERP, the first was poisoned and is replaced. If it confirms the new SERP, the change was real. Total replacements left unresolved are dropped, unless ' + pct(C.massReplacementShare) + '+ of keywords flip at once. That is more than poisoning has been measured to reach, so it is treated as a real, violent update.',
        'this sweep: ' + e.instrument.measured + '/' + e.instrument.stations + ' measured · ' + e.instrument.rejected + ' rejected · ' + e.instrument.poisonCaught + ' poisoned reads caught by re-fetch · ' + e.instrument.errors + ' errors', '')
      + '</section>';
  }
  function step(n, title, p, eq, why) {
    return '<div class="step"><div class="n">' + n + '</div><div><b>' + title + '</b><p>' + p + '</p>' + (eq ? '<div class="eq">' + esc(eq) + '</div>' : '') + (why ? '<div class="why">' + why + '</div>' : '') + '</div></div>';
  }

  function eventsHtml() {
    const ev = D.events.slice().reverse();
    const rows = ev.map((e) => '<tr><td>' + day(e.start) + ' → ' + (e.end ? day(e.end) : '<b>ongoing</b>') + '</td><td class="num"><span class="dot" style="background:' + sev(e.peak).c + '"></span> M' + f1(e.peak) + '</td><td>' + esc(e.category) + '</td><td class="num">' + pct(e.peakBreadth) + '</td><td>' + esc(e.faults.join(', ')) + '</td><td>' + (e.confirmed.length ? esc(e.confirmed.join(', ')) : '<span class="muted">not confirmed by Google' + (e.ongoing ? ' (yet)' : '') + '</span>') + '</td></tr>').join('');
    return '<section class="card"><h2>Quake log</h2><div class="sub">Events this instrument declared on its own, matched afterwards against Google\'s confirmed updates. Google confirms only some of what it ships, so an unconfirmed quake is not automatically a false alarm.</div>'
      + (ev.length ? '<div style="overflow-x:auto"><table class="data"><thead><tr><th>When</th><th>Peak</th><th>Class</th><th>Peak breadth</th><th>Fault lines</th><th>Google confirmed</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">No quakes declared yet.</p>') + '</section>';
  }

  function scaleHtml() {
    const rows = D.scale.slice().reverse().map((s, k, a) => {
      const hi = k < a.length - 1 ? a[k + 1].min : 10;
      const R = Math.pow(2, (s.min - 2) / 3);
      return '<tr><td class="num"><span class="dot" style="background:' + sev(s.min).c + '"></span> ' + s.min + '–' + hi + '</td><td><b>' + esc(s.name) + '</b></td><td class="num">' + (s.min === 0 ? '< 1.26×' : '≥ ' + R.toFixed(2) + '×') + '</td><td>' + esc(s.note) + '</td></tr>';
    }).join('');
    return '<section class="card"><h2>The scale</h2><div class="sub">What each magnitude means as a multiple of a normal day\'s shaking. The class names are a starting hypothesis. Run <code>quake calibrate</code> once you have a few months of data, and it will report what magnitudes Google\'s confirmed core and spam updates actually produced on your stations.</div>'
      + '<div style="overflow-x:auto"><table class="data"><thead><tr><th>Magnitude</th><th>Class</th><th>Network shaking</th><th>Typically</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  function sourcesHtml() {
    return '<section class="card"><details><summary>Why it is built this way</summary><div class="why" style="margin-top:8px">'
      + '<p><b>Why not use an existing volatility score?</b> Third-party sensors (Semrush Sensor, MozCast, Ahrefs) are built on the same scraped SERPs that Google is now poisoning, and each uses a private method. This instrument shows its arithmetic, rejects poisoned reads explicitly, and checks itself against Google\'s own confirmed-update record.</p>'
      + '<p><b>Why 48 keywords in 8 verticals?</b> Every vertical mixes YMYL, commercial and informational intent, so a niche update lights one fault line and a core update lights all of them. More stations means a steadier needle and a higher API bill. Edit <code>stations.json</code> to track your own market.</p>'
      + '<p><b>What this cannot see.</b> It sees one location (US English desktop by default) and one personalization-free view of Google. Personalized results, other countries and mobile can move differently. Shaking means rankings moved, not which sites won. For that, look at the most-shaken keywords in the station array.</p>'
      + '<p>Sources: Google Search Status Dashboard (status.search.google.com) for confirmed updates; Ahrefs, "SERP data update" (Oct 2026) on poisoned results; Webber, Moffat &amp; Zobel, "A similarity measure for indefinite rankings" (2010) for RBO; Allen (1978) for the STA/LTA trigger.</p>'
      + '</div></details></section>';
  }

  addEventListener('resize', () => { if (D && D.sweeps.length) { drawSeismo(); drawHealth(); } });
  load();
})();
</script>
</body>
</html>
