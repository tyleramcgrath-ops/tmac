<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(../assets/fonts/Barlow-900.woff2);font-weight:900}
@font-face{font-family:B;src:url(../assets/fonts/Barlow-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(../assets/fonts/IBM_Plex_Mono-600.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:B}
.bg{position:absolute;inset:0;background:#0b0b0b}
.car{position:absolute;right:-180px;top:40px;width:1050px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%);mask-image:linear-gradient(90deg,transparent 0%,#000 22%)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.6) 45%,rgba(0,0,0,0) 70%)}
.pill{position:absolute;top:44px;left:50px;transform:rotate(-2deg);background:#FFC94A;color:#111;font-family:M;font-weight:600;font-size:28px;letter-spacing:.12em;padding:8px 20px;border-radius:6px}
.h{position:absolute;top:110px;left:50px;color:#fff;font-weight:900;font-size:96px;line-height:.88;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.4),0 10px 40px rgba(0,0,0,.8)}
.h span{color:#FFC94A}
.cost{position:absolute;top:330px;left:50px}
.cost .l{display:inline-block;background:#FF3B30;color:#fff;font-family:M;font-weight:600;font-size:28px;letter-spacing:.14em;padding:6px 18px;border-radius:6px}
.cost .v{color:#FF3B30;font-weight:900;font-size:190px;line-height:1;letter-spacing:-.03em;text-shadow:0 8px 0 rgba(0,0,0,.45),0 0 50px rgba(255,59,48,.45)}
.cost .y{color:#fff;font-weight:800;font-size:44px;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.9)}
.tag{position:absolute;top:470px;right:60px;transform:rotate(6deg);background:#fff;color:#111;border-radius:12px;padding:6px 20px 10px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tag .a{font-family:M;font-weight:600;font-size:20px;letter-spacing:.14em}
.tag .b{font-weight:900;font-size:62px;line-height:1;text-decoration:line-through;text-decoration-color:#FF3B30;text-decoration-thickness:6px}
</style></head><body>
<div class="bg"></div><img class="car" src="urus.jpg"><div class="shade"></div>
<div class="pill">WHAT THEY DON'T SEE</div>
<div class="h">THE LAMBO'S<br><span>REAL</span> PRICE</div>
<div class="tag"><div class="a">STICKER</div><div class="b">$250K</div></div>
<div class="cost"><div class="l">+ YEAR ONE</div><div class="v">$58,700</div><div class="y">nobody tells you this</div></div>
</body></html>
