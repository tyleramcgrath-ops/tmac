<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(../assets/fonts/Barlow-900.woff2);font-weight:900}
@font-face{font-family:B;src:url(../assets/fonts/Barlow-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(../assets/fonts/IBM_Plex_Mono-600.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:B}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover}
.car{position:absolute;left:-260px;top:600px;width:1600px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 80%,transparent 100%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,0) 62%,rgba(0,0,0,.85) 82%,#000 100%)}
.pill{position:absolute;top:120px;left:50%;transform:translateX(-50%) rotate(-2deg);background:#FFC94A;color:#111;font-family:M;font-weight:600;font-size:46px;letter-spacing:.12em;padding:14px 34px;border-radius:8px;white-space:nowrap}
.h{position:absolute;top:230px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:150px;line-height:.88;text-transform:uppercase;letter-spacing:-.02em;text-shadow:0 8px 0 rgba(0,0,0,.4),0 12px 50px rgba(0,0,0,.8)}
.h span{color:#FFC94A}
.cost{position:absolute;top:1390px;left:0;right:0;text-align:center}
.cost .l{display:inline-block;background:#FF3B30;color:#fff;font-family:M;font-weight:600;font-size:44px;letter-spacing:.14em;padding:12px 30px;border-radius:8px}
.cost .v{color:#FF3B30;font-weight:900;font-size:260px;line-height:1;letter-spacing:-.03em;text-shadow:0 10px 0 rgba(0,0,0,.45),0 0 60px rgba(255,59,48,.45)}
.cost .y{color:#fff;font-weight:800;font-size:70px;text-transform:uppercase;margin-top:-6px;text-shadow:0 6px 30px rgba(0,0,0,.9)}
.tag{position:absolute;top:1040px;right:70px;transform:rotate(6deg);background:#fff;color:#111;border-radius:14px;padding:10px 26px 14px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tag .a{font-family:M;font-weight:600;font-size:26px;letter-spacing:.14em}
.tag .b{font-weight:900;font-size:84px;line-height:1;text-decoration:line-through;text-decoration-color:#FF3B30;text-decoration-thickness:8px}
</style></head><body>
<div class="bg"></div><img class="car" src="urus.jpg"><div class="shade"></div>
<div class="pill">WHAT THEY DON'T SEE</div>
<div class="h">THE LAMBO'S<br><span>REAL</span> PRICE</div>
<div class="tag"><div class="a">STICKER</div><div class="b">$250K</div></div>
<div class="cost"><div class="l">+ YEAR ONE</div><div class="v">$58,700</div><div class="y">nobody tells you this</div></div>
</body></html>
