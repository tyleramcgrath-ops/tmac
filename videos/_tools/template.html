<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="assets/vendor/gsap.min.js"></script>
<style>
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-600.woff2") format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-800.woff2") format("woff2");font-weight:800;font-display:block}
@font-face{font-family:"Plex";src:url("assets/fonts/IBM_Plex_Mono-500.woff2") format("woff2");font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Barlow",sans-serif}
#footage{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.6) 100%)}
.pill{position:absolute;top:110px;left:70px;font-family:"Plex",monospace;font-weight:500;font-size:28px;letter-spacing:.16em;color:#fff;
  padding:10px 20px;border-radius:40px;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(6px)}
.pill b{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:12px;vertical-align:middle}
.tag{position:absolute;left:70px;top:1230px;padding:18px 26px 20px;border-radius:16px;background:rgba(10,10,10,.42);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18);color:#fff;min-width:360px}
.tag .k{font-family:"Plex",monospace;font-weight:500;font-size:27px;letter-spacing:.16em;color:rgba(255,255,255,.75)}
.tag .v{font-weight:700;font-size:76px;line-height:1.05;letter-spacing:-.01em}
.tag .s{font-family:"Plex",monospace;font-size:20px;letter-spacing:.1em;color:rgba(255,255,255,.6);margin-top:4px}
.mid{position:absolute;left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
  <video id="footage" class="clip" src="assets/footage/track.mp4" muted playsinline data-start="0" data-duration="{{TOTAL}}" data-track-index="0"></video>
  <div id="ovl" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="1" style="position:absolute;inset:0">
    <div id="shade"></div>
    {{ELS}}
  </div>
  <div id="caps" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{TOTAL}}" data-track-index="2"></div>
  {{AUDIO}}
</div>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  function IN(sel, at, from){ tl.fromTo(sel, Object.assign({opacity:0, y:24}, from||{}), {opacity:1, y:0, x:0, scale:1, duration:0.45, ease:"power3.out", immediateRender:false}, at); }
  function OUT(sel, at){ tl.to(sel, {opacity:0, y:-10, duration:0.3, ease:"power2.in"}, at); }
  {{TL}}
  tl.to({}, {duration:{{TOTAL}}}, 0);
  window.__timelines["main"] = tl;
})();
</script>
</body></html>
