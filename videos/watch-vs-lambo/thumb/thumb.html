<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../assets/fonts/Barlow-900.woff2);font-weight:900}
@font-face{font-family:B;src:url(../assets/fonts/Barlow-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(../assets/fonts/IBM_Plex_Mono-600.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:B}
.top{position:absolute;left:0;top:0;width:1080px;height:960px;background:url(urus.jpg) 30% 60%/auto 120%}
.bot{position:absolute;left:0;top:960px;width:1080px;height:960px;background:url(watch.jpg) center/cover}
.sh1{position:absolute;left:0;top:0;width:1080px;height:960px;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0) 45%)}
.sh2{position:absolute;left:0;top:960px;width:1080px;height:960px;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0) 50%)}
.bar{position:absolute;left:0;top:952px;width:1080px;height:16px;background:#fff}
.h{position:absolute;top:70px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:120px;line-height:.9;text-shadow:0 8px 0 rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.8)}
.h span{color:#FFC94A}
.st{position:absolute;font-weight:900;font-size:200px;line-height:1;padding:4px 36px;border:12px solid currentColor;border-radius:22px;background:rgba(0,0,0,.6)}
.r{color:#FF3B30;left:70px;top:600px;transform:rotate(-7deg)}
.g{color:#5CFF7A;right:50px;top:1660px;font-size:170px;transform:rotate(-7deg)}
.l{position:absolute;font-family:M;font-weight:600;font-size:40px;letter-spacing:.14em;color:#fff;background:rgba(0,0,0,.7);padding:8px 20px;border-radius:8px}
.vs{position:absolute;left:50%;top:960px;transform:translate(-50%,-50%);background:#FF3B30;color:#fff;font-weight:900;font-size:84px;padding:14px 40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);white-space:nowrap}
</style></head><body>
<div class="top"></div><div class="bot"></div><div class="sh1"></div><div class="sh2"></div><div class="bar"></div>
<div class="h">ONLY ONE<br><span>HOLDS VALUE</span></div>
<div class="l" style="left:70px;top:520px">LAMBO · 5 YRS</div><div class="st r">−34%</div>
<div class="l" style="right:60px;top:1560px">ROLEX · RESALE</div><div class="st g">+89%</div>
<div class="vs">WATCH or CAR?</div>
</body></html>
