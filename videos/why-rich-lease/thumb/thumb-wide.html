<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../assets/fonts/Barlow-800.woff2);font-weight:800}
@font-face{font-family:M;src:url(../assets/fonts/IBM_Plex_Mono-500.woff2);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:B}
.a{position:absolute;inset:0;background:url(a.jpg) 70% 40%/cover;filter:contrast(1.08) saturate(1.15)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.2) 55%,rgba(0,0,0,0))}
.h{position:absolute;top:60px;left:50px;text-align:left;color:#fff;font-weight:800;font-size:84px;line-height:.95;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.h span{color:#FFC94A}
.pill{position:absolute;left:50px;top:440px;font-family:M;font-weight:500;font-size:28px;letter-spacing:.14em;color:#fff;padding:12px 26px;border-radius:50px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.7)}
.pill b{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:16px;vertical-align:middle;background:#5CFF7A}
.n{position:absolute;left:50px;top:520px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.n .v{font-weight:800;font-size:110px;line-height:1}
.n .k{display:inline-block;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:8px;font-family:M;font-size:24px;letter-spacing:.14em;color:#5CFF7A}
</style></head><body>
<div class="a"></div><div class="sh"></div>
<div class="h">HE DOESN'T<br><span>OWN</span> THE CAR.</div>
<div class="pill"><b></b>LEASED, NOT OWNED</div>
<div class="n"><div class="k">$300K KEPT INVESTED</div><div class="v">+$120K</div></div>
</body></html>
