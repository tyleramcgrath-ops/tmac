<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var q = function (id) { return document.getElementById(id); };
    var totalEl = q("rc04-total-value");
    var counter = { v: 34600 };
    var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-US"); };
    var writeTotal = function () { totalEl.textContent = fmt(counter.v); };

    // ---- ambient camera: slow push on the row stack + drifting background numeral
    tl.fromTo("#rc04-rows", { scale: 1 }, { scale: 1.03, duration: 6.891, ease: "none" }, 0);
    tl.fromTo("#rc04-bgnum", { y: 60 }, { y: -40, duration: 6.891, ease: "none" }, 0);

    // ---- t=0 content: slot hairlines draw, kicker stub draws
    tl.fromTo(["#rc04-line-1", "#rc04-line-2", "#rc04-line-3"], { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out", stagger: 0.06 }, 0);
    tl.fromTo("#rc04-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0);
    tl.fromTo("#rc04-kicker-text", { opacity: 0.35, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0);

    // ---- row reveal helper (kinetic beat-slam: label slides from left, figure slams)
    function landLabel(n, t) {
      tl.fromTo("#rc04-hot-" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, t);
      tl.fromTo("#rc04-tag-" + n, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
      tl.fromTo("#rc04-label-" + n,
        { opacity: 0, x: -160, filter: "blur(14px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.42, ease: "power4.out" }, t + 0.03);
    }
    function landQual(n, t) {
      tl.fromTo("#rc04-qual-" + n, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, t);
    }
    function slamFig(n, t, total) {
      tl.fromTo("#rc04-fig-" + n,
        { opacity: 0, scale: 1.55, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power4.out" }, t);
      tl.to(counter, { v: total, duration: 0.38, ease: "power2.out", onUpdate: writeTotal }, t);
      tl.fromTo("#rc04-total-value", { scale: 1.16 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
    }
    function dimLabel(n, t) {
      tl.to("#rc04-label-" + n, { opacity: 0.5, duration: 0.3, ease: "power2.out" }, t);
    }

    // Scene 1 — insurance (0.0–2.2s)
    landLabel(1, 0.04);              // "Insurance"
    tl.fromTo("#rc04-line-1", { backgroundColor: "#282826" }, { backgroundColor: "#505048", duration: 0.3, ease: "power2.out" }, 0.68); // "runs"
    landQual(1, 0.98);               // "around"
    slamFig(1, 1.50, 41200);         // "$6,600"

    // Scene 2 — dealer service (2.2–4.4s)
    landLabel(2, 2.69);              // "dealer"
    dimLabel(1, 2.69);
    landQual(2, 3.48);               // "about"
    slamFig(2, 3.84, 43200);         // "$2,000"

    // Scene 3 — tires (4.4–6.891s)
    landLabel(3, 4.88);              // "set"
    dimLabel(2, 4.88);
    landQual(3, 5.27);               // "tires"
    slamFig(3, 5.68, 46200);         // "$3,000"

    // hold: upkeep subtotal rule draws under the stack
    tl.fromTo("#rc04-sum-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 6.15);
    tl.fromTo("#rc04-sum-text", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.25);

    window.__timelines["04-running-costs"] = tl;
  })();
</script>
