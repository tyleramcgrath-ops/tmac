    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var R = document.querySelector('[data-composition-id="05-opportunity-cost"]');
        var q = function (s) { return R.querySelector(s); };
        var qa = function (s) { return R.querySelectorAll(s); };
        var tl = gsap.timeline({ paused: true });

        // typewriter helper — deterministic char reveal via a tweened counter
        function typeOn(el, text, at, dur) {
          var st = { n: 0 };
          el.textContent = '';
          tl.fromTo(st, { n: 0 }, {
            n: text.length, duration: dur, ease: 'none',
            onUpdate: function () { el.textContent = text.slice(0, Math.round(st.n)); }
          }, at);
        }

        // macro camera push under everything (stage only; total stays pinned)
        tl.fromTo(q('.oc05-stage'), { scale: 1 }, { scale: 1.035, duration: 6.912, ease: 'none' }, 0);
        tl.fromTo(q('.oc05-num'), { y: 0 }, { y: -90, duration: 6.912, ease: 'none' }, 0);

        // ── Scene 1 (0.0–1.8s): kicker types on, headline words land on cues
        typeOn(q('.oc05-k'), 'OPPORTUNITY COST', 0, 0.7);
        var w = qa('.oc05-w');
        var cues = [0.27, 0.54, 0.80, 1.43];
        for (var i = 1; i < w.length; i++) {
          tl.fromTo(w[i],
            { opacity: 0, y: 60, filter: 'blur(10px)' },
            { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.32, ease: 'power4.out' },
            cues[i] - 0.06);
        }
        // first word is already on screen at t=0, gives it a small settle
        tl.fromTo(w[0], { scale: 1.12 }, { scale: 1, duration: 0.4, ease: 'power3.out' }, 0);
        // "counts" punch
        tl.fromTo(w[3], { color: '#E85D26' }, { color: '#F0ECE5', duration: 0.5, ease: 'power2.out' }, 1.6);

        // ── Scene 2 (1.8–4.5s): headline shrinks up; terms stack in
        tl.fromTo(q('.oc05-hd'), { y: 0, scale: 1, opacity: 1 },
          { y: -230, scale: 0.46, opacity: 0.55, duration: 0.5, ease: 'power4.inOut' }, 1.9);

        tl.fromTo(q('.oc05-a'),
          { opacity: 0, scale: 1.25, filter: 'blur(18px)' },
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.38, ease: 'power4.out' }, 2.22);
        typeOn(q('.oc05-ta'), 'CASH IN THE CAR', 2.6, 0.45);
        // "invested" — the cash nudges up, getting ready to work
        tl.fromTo(q('.oc05-a'), { y: 0 }, { y: -14, duration: 0.5, ease: 'power3.out', immediateRender: false }, 3.0);
        tl.fromTo(q('.oc05-tag-a'), { y: 0 }, { y: -14, duration: 0.5, ease: 'power3.out' }, 3.0);

        tl.fromTo(q('.oc05-b'),
          { opacity: 0, x: 140, filter: 'blur(12px)' },
          { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.36, ease: 'power4.out' }, 3.72);
        typeOn(q('.oc05-tb'), 'PER YEAR, INVESTED', 4.1, 0.5);

        // ── Scene 3 (4.5–6.9s): hairline draws, result slams, total counts up
        tl.fromTo(q('.oc05-line'), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power3.inOut' }, 4.82);

        tl.fromTo(q('.oc05-c'),
          { opacity: 0, scale: 1.7, filter: 'blur(14px)' },
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.24, ease: 'power4.in' }, 5.3);
        tl.fromTo(q('.oc05-c'), { y: 0 }, { y: -10, duration: 0.18, ease: 'power2.out' }, 5.54);
        // impact jolt on the slam
        tl.fromTo(q('.oc05-stage'), { x: 0 }, { x: -9, duration: 0.05, ease: 'power2.out' }, 5.54);

        typeOn(q('.oc05-tc'), 'LOST RETURN', 5.95, 0.4);
        // terms recede so the result owns the frame
        tl.fromTo([q('.oc05-a'), q('.oc05-b')], { opacity: 1 }, { opacity: 0.4, duration: 0.5, ease: 'power2.out', immediateRender: false }, 5.6);

        // running total $46,200 → $58,700
        var tv = q('.oc05-total-value');
        var tot = { v: 46200 };
        tl.fromTo(tot, { v: 46200 }, {
          v: 58700, duration: 0.9, ease: 'power3.out',
          onUpdate: function () { tv.textContent = '$' + String(Math.round(tot.v)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

        tl.fromTo(tv, { scale: 1 }, { scale: 1.12, duration: 0.18, ease: 'power3.out' }, 5.36);

        tl.set({}, {}, 6.912);
