name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - .
          - apps/citation-gap
          - apps/girls-around-the-globe
          - apps/lawmatchnow
          - apps/north-star-hq
          - apps/reloop
          - apps/saysites
          - seo-intel
          - shorts
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Type-check
        if: matrix.project == 'apps/lawmatchnow'
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        if: matrix.project == 'apps/girls-around-the-globe'
        run: pnpm test
