name: North Star scheduler tick

# Vercel's Hobby plan doesn't support platform crons, so this workflow is the
# trigger for North Star HQ's /api/internal/cron instead — the same workaround
# the root RankForge app uses (see .github/workflows/scheduler-cron.yml and
# SCHEDULER_DESIGN.md §7). Every run does bounded work (reap stale locks ->
# materialize due schedules -> drain a few due jobs) and is safe to over-fire —
# job claiming is atomic. 15 min matches the root app's cadence.
#
# Requires two repo configuration values (Settings -> Secrets and variables ->
# Actions), distinct from the root app's CRON_SECRET/CRON_APP_URL since this
# targets a separate Vercel project:
#   - Secret  NORTH_STAR_CRON_SECRET — must exactly match the CRON_SECRET set
#                                       on the north-star-hq Vercel project.
#   - Variable NORTH_STAR_CRON_APP_URL — the production URL, e.g.
#                                         https://north-star-hq.vercel.app
#                                         (optional; falls back to that default).
#
# The tick itself lives in .github/actions/scheduler-tick so this and the
# RankForge trigger cannot drift apart — this workflow was originally forked
# from an older copy of that one and inherited a bug already fixed there.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scheduler-tick
        with:
          app-name: North Star
          cron-secret: ${{ secrets.NORTH_STAR_CRON_SECRET }}
          secret-name: NORTH_STAR_CRON_SECRET
          app-url: ${{ vars.NORTH_STAR_CRON_APP_URL }}
          default-app-url: https://north-star-hq.vercel.app
