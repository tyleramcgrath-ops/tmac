<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452"
     role="img" aria-labelledby="honestyTitle honestyDesc">
  <title id="honestyTitle">What the skill measures, what it does not, and what it never claims</title>
  <desc id="honestyDesc">Three columns. Measured, on the free path with no keys: crawl issues triaged by impact; Search Console queries, clicks and positions; search-results presence on ten locked prompts. Not measured, and reported as not measured rather than as zero: tracked rank positions, search volume and keyword difficulty, backlinks and referring domains — those need the DataForSEO power-up. Never claimed, with or without a key: that ChatGPT cited you, because the free number is a search-results proxy and not a citation; a zero standing in for missing data; a number with no source and no date.</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="450.5" rx="24" fill="#0B0F14" stroke="#232B36" stroke-width="1.5"/>

  <g id="board-header">
    <text x="64" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="3" fill="#7EE787">DATA HONESTY</text>
    <text x="1136" y="58" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" fill="#6E7B8A">SKILL.md hard rules</text>
    <text x="64" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="40" font-weight="700" fill="#E6EDF3">Missing data is reported as missing. Never zero.</text>
  </g>

  <!-- column 1: measured — filled marker, the same one the phase menu uses for done -->
  <g id="col-measured">
    <rect x="64" y="142" width="342" height="280" rx="12" fill="#131A22" stroke="#2A3441" stroke-width="1.5"/>
    <rect x="82" y="160" width="10" height="10" fill="#3FB950"/>
    <text x="106" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="2.5" fill="#7EE787">MEASURED</text>
    <line x1="82" y1="194" x2="388" y2="194" stroke="#2A3441" stroke-width="1.5"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#C9D4E0">
      <rect x="84" y="216" width="9" height="9" fill="#3FB950"/>
      <text x="108" y="226">crawl issues,</text>
      <text x="108" y="250">triaged by impact</text>

      <rect x="84" y="278" width="9" height="9" fill="#3FB950"/>
      <text x="108" y="288">Search Console queries,</text>
      <text x="108" y="312">clicks and positions</text>

      <rect x="84" y="340" width="9" height="9" fill="#3FB950"/>
      <text x="108" y="350">search-results presence,</text>
      <text x="108" y="374">10 locked prompts</text>
    </g>

    <line x1="82" y1="394" x2="388" y2="394" stroke="#2A3441" stroke-width="1.5"/>
    <text x="82" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#6E7B8A">free path, no keys</text>
  </g>

  <!-- column 2: not measured — hollow marker, the phase menu's pending shape -->
  <g id="col-not-measured">
    <rect x="429" y="142" width="342" height="280" rx="12" fill="#131A22" stroke="#2A3441" stroke-width="1.5"/>
    <rect x="447.75" y="160.75" width="8.5" height="8.5" fill="none" stroke="#E3B341" stroke-width="1.5"/>
    <text x="471" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="2.5" fill="#E3B341">NOT MEASURED</text>
    <line x1="447" y1="194" x2="753" y2="194" stroke="#2A3441" stroke-width="1.5"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#C9D4E0">
      <rect x="449.75" y="216.75" width="7.5" height="7.5" fill="none" stroke="#E3B341" stroke-width="1.5"/>
      <text x="473" y="226">tracked rank</text>
      <text x="473" y="250">positions</text>

      <rect x="449.75" y="278.75" width="7.5" height="7.5" fill="none" stroke="#E3B341" stroke-width="1.5"/>
      <text x="473" y="288">search volume,</text>
      <text x="473" y="312">keyword difficulty</text>

      <rect x="449.75" y="340.75" width="7.5" height="7.5" fill="none" stroke="#E3B341" stroke-width="1.5"/>
      <text x="473" y="350">backlinks,</text>
      <text x="473" y="374">referring domains</text>
    </g>

    <line x1="447" y1="394" x2="753" y2="394" stroke="#2A3441" stroke-width="1.5"/>
    <text x="447" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#6E7B8A">needs DataForSEO</text>
  </g>

  <!-- column 3: never claimed — the dash, the menu's marker for a row that carries no state -->
  <g id="col-never-claimed">
    <rect x="794" y="142" width="342" height="280" rx="12" fill="#131A22" stroke="#2A3441" stroke-width="1.5"/>
    <rect x="812" y="163.75" width="10" height="2.5" fill="#8A97A6"/>
    <text x="836" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="2.5" fill="#8A97A6">NEVER CLAIMED</text>
    <line x1="812" y1="194" x2="1118" y2="194" stroke="#2A3441" stroke-width="1.5"/>

    <g fill="#C9D4E0">
      <rect x="814" y="219.75" width="9" height="2.5" fill="#8A97A6"/>
      <text x="838" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#E6EDF3">"ChatGPT cited you"</text>
      <text x="838" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19">the proxy is not that</text>

      <rect x="814" y="281.75" width="9" height="2.5" fill="#8A97A6"/>
      <text x="838" y="288" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19">a 0 standing in</text>
      <text x="838" y="312" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19">for missing data</text>

      <rect x="814" y="343.75" width="9" height="2.5" fill="#8A97A6"/>
      <text x="838" y="350" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19">a number with</text>
      <text x="838" y="374" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19">no source, no date</text>
    </g>

    <line x1="812" y1="394" x2="1118" y2="394" stroke="#2A3441" stroke-width="1.5"/>
    <text x="812" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#6E7B8A">with or without a key</text>
  </g>
</svg>
