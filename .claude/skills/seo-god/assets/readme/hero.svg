<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">SEO-GOD — a Claude Code skill</title>
  <desc id="heroDesc">Point Claude Code at your own site: it audits, fixes and measures, then runs the whole loop again tomorrow. Under the title, the whole install: clone, then /seo-god, then it runs again tomorrow at 05:00. Beside it, the skill's own menu: setup, audit and measure done; ai_visibility and schedule pending; act available on demand; power-ups optional.</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="24" fill="#0B0F14" stroke="#232B36" stroke-width="1.5"/>

  <!-- title block -->
  <g id="title-block">
    <rect x="64" y="44" width="8" height="22" rx="2" fill="#3FB950"/>
    <text x="86" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" letter-spacing="3.2" fill="#7EE787">CLAUDE CODE SKILL</text>

    <text x="64" y="164" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="82" font-weight="800" letter-spacing="-1.5" fill="#E6EDF3">SEO-GOD</text>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
       font-size="26" fill="#B6C2CF">
      <text x="64" y="216">Point Claude Code at your own site.</text>
      <text x="64" y="252">It audits, fixes, and measures — then</text>
      <text x="64" y="288">runs the whole loop again tomorrow.</text>
    </g>

    <line x1="64" y1="320" x2="552" y2="320" stroke="#232B36" stroke-width="1.5"/>
    <text x="64" y="352" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19"><tspan fill="#6E7B8A">clone · </tspan><tspan fill="#C9D4E0">/seo-god</tspan><tspan fill="#6E7B8A"> · again tomorrow, 05:00</tspan></text>
  </g>

  <!-- the skill's own first screen -->
  <g id="phase-menu">
    <rect x="620" y="44" width="516" height="332" rx="14" fill="#131A22" stroke="#2A3441" stroke-width="1.5"/>
    <line x1="620" y1="92" x2="1136" y2="92" stroke="#2A3441" stroke-width="1.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6E7B8A">
      <text x="644" y="74">claude code</text>
      <text x="1112" y="74" text-anchor="end">seo-god.json</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="644" y="126" fill="#7EE787">&gt;</text>
      <text x="668" y="126" fill="#E6EDF3">/seo-god</text>
      <text x="644" y="158" fill="#C9D4E0">SEO-GOD — https://your-site.com</text>
    </g>

    <!-- the five phases carry state; act and power-ups are always-available, so they take a dash -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <rect x="648" y="182" width="9" height="9" fill="#3FB950"/>
      <text x="676" y="192" fill="#C9D4E0">setup</text>
      <text x="864" y="192" fill="#7EE787">done</text>

      <rect x="648" y="209" width="9" height="9" fill="#3FB950"/>
      <text x="676" y="219" fill="#C9D4E0">audit</text>
      <text x="864" y="219" fill="#7EE787">done</text>

      <rect x="648" y="236" width="9" height="9" fill="#3FB950"/>
      <text x="676" y="246" fill="#C9D4E0">measure</text>
      <text x="864" y="246" fill="#7EE787">done</text>

      <rect x="648.75" y="263.75" width="7.5" height="7.5" fill="none" stroke="#4A5563" stroke-width="1.5"/>
      <text x="676" y="273" fill="#C9D4E0">ai_visibility</text>
      <text x="864" y="273" fill="#8A97A6">pending</text>

      <rect x="648.75" y="290.75" width="7.5" height="7.5" fill="none" stroke="#4A5563" stroke-width="1.5"/>
      <text x="676" y="300" fill="#C9D4E0">schedule</text>
      <text x="864" y="300" fill="#8A97A6">pending</text>

      <rect x="648" y="321" width="9" height="2" fill="#4A5563"/>
      <text x="676" y="327" fill="#C9D4E0">act</text>
      <text x="864" y="327" fill="#8A97A6">on demand</text>

      <rect x="648" y="348" width="9" height="2" fill="#4A5563"/>
      <text x="676" y="354" fill="#C9D4E0">power-ups</text>
      <text x="864" y="354" fill="#8A97A6">optional</text>
    </g>
  </g>
</svg>
